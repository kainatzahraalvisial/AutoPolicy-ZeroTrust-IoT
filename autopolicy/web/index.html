<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <meta name="description" content="AutoPolicy: intelligent IoT anomaly detection and automated Zero Trust policy enforcement.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="autopolicy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AutoPolicy — Zero Trust IoT Security</title>
  <style>
    html, body { margin: 0; background: var(--startup-bg, #050a08); }
    #startup { position: fixed; inset: 0; display: grid; place-content: center;
      background: var(--startup-bg, #050a08); color: var(--startup-text, #b1a9da); font: 13px sans-serif; text-align: center; letter-spacing: 1.2px; }
  </style>
  <script>
    try {
      if (localStorage.getItem('flutter.autopolicy.darkTheme') === 'false') {
        document.documentElement.style.setProperty('--startup-bg', '#FAF9F6');
        document.documentElement.style.setProperty('--startup-text', '#000000');
      }
    } catch (_) {}
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="startup" role="status" aria-label="Loading AutoPolicy">
    <span>Loading...</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('startup')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
